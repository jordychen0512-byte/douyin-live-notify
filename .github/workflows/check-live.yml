name: Check Douyin Live

on:
  workflow_dispatch:

  schedule:
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamget requests
          streamget install-node

      - name: Check Douyin live status
        run: python monitor.py

      - name: Save live state
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update live state"
              git push
            else
              echo "Live state did not change."
            fi
          fi
