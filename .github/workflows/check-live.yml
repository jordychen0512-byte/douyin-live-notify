name: Check Douyin Live

on:
  workflow_dispatch:

  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest

    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install streamget requests
          streamget install-node

      - name: Test Discord webhook
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          import os
          import requests

          url = os.environ["DISCORD_WEBHOOK_URL"]

          response = requests.post(
              url,
              json={
                  "content": "✅ **抖音直播通知測試成功！**\nGitHub Actions 已成功連接 Discord。"
              },
              timeout=15,
          )

          response.raise_for_status()
          print("Discord webhook test successful")
          PY

      - name: Check Douyin live status
        run: python monitor.py

      - name: Save live state
        run: |
          if [ -f state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add state.json

            if ! git diff --cached --quiet; then
              git commit -m "Update live state"
              git push
            else
              echo "Live state did not change."
            fi
          fi
